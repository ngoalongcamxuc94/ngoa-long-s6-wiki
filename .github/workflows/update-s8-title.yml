name: Update Wiki title to S8

on:
  push:
    paths:
      - '.github/workflows/update-s8-title.yml'

permissions:
  contents: write

jobs:
  update-title:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update title only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<title>Ngọa Long Cảm Xúc S7 Wiki</title>'
          new = '<title>Ngọa Long Cảm Xúc S8 Wiki</title>'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one title, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8', newline='')
          PY

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Đổi tiêu đề Wiki từ S7 sang S8'
          git push
