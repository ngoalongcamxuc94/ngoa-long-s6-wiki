name: Remove special hero group

on:
  push:
    paths:
      - '.github/workflows/remove-special-heroes.yml'

permissions:
  contents: write

jobs:
  remove-special:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove special hero group and data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import json

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the entire static "Tướng đặc biệt" section.
          pattern = r'<section class="group" data-group="Tướng đặc biệt">.*?</section>(?=<section class="group" data-group="Supper">)'
          s2, n = re.subn(pattern, '', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected exactly 1 special-hero section, found {n}')

          # Remove the six special heroes (ids 0..5) from HEROES while preserving every other hero.
          marker = 'const HEROES='
          start = s2.find(marker)
          if start < 0:
              raise SystemExit('HEROES array not found')
          arr_start = start + len(marker)
          arr_end = s2.find('];', arr_start)
          if arr_end < 0:
              raise SystemExit('HEROES array end not found')
          raw = s2[arr_start:arr_end+1]
          heroes = json.loads(raw)
          before = len(heroes)
          special = [h for h in heroes if str(h.get('group','')).strip().lower() == 'tướng đặc biệt']
          if len(special) != 6 or {h.get('id') for h in special} != set(range(6)):
              raise SystemExit(f'Unexpected special hero data: {[(h.get("id"), h.get("name")) for h in special]}')
          heroes = [h for h in heroes if str(h.get('group','')).strip().lower() != 'tướng đặc biệt']
          if len(heroes) != before - 6:
              raise SystemExit('Special hero data removal count mismatch')
          s2 = s2[:arr_start] + json.dumps(heroes, ensure_ascii=False, separators=(',', ':')) + s2[arr_end+1:]

          # Safety checks: S8 title stays intact and the normal Supper group remains.
          if '<title>Ngọa Long Cảm Xúc S8 Wiki</title>' not in s2:
              raise SystemExit('S8 title check failed')
          if 'data-group="Supper"' not in s2:
              raise SystemExit('Normal hero group check failed')
          if 'data-group="Tướng đặc biệt"' in s2:
              raise SystemExit('Special hero group still present')

          p.write_text(s2, encoding='utf-8')
          print(f'Removed special hero section and {before-len(heroes)} special hero records; remaining HEROES={len(heroes)}')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'S8: Xóa toàn bộ nhóm tướng đặc biệt' || exit 0
          git push
